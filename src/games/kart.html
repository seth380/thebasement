<title>Turbo Meadow Kart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-bleed 3D race view, sticker-style HUD pinned to the corners, one centered card for menu and results. */
:root{
  --sky-top:#2f9bff; --sky-low:#d6f3ff;
  --ink:#1d1640; --cream:#fff8e7; --sun:#ffc928; --berry:#ff4d6d; --grape:#6c4bd8; --mint:#2fd08a;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky-low);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:relative;height:100%;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-low) 62%)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sticker{background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
#pos{position:absolute;left:16px;top:16px;padding:4px 14px 6px;font-family:var(--display);font-size:44px;line-height:1;transform:rotate(-4deg);background:var(--sun)}
#pos small{font-size:18px;opacity:.7}
#lapbox{position:absolute;right:16px;top:16px;padding:6px 12px;text-align:right;font-variant-numeric:tabular-nums}
#lapbox b{font-family:var(--display);font-weight:400;font-size:22px;display:block;line-height:1.1}
#lapbox span{font-size:16px}
#power{position:absolute;left:16px;top:84px;padding:4px 10px;font-size:13px;letter-spacing:.08em;transform:rotate(-2deg)}
#power b{color:#ff4d6d;font-size:16px;letter-spacing:.1em}#power i{font-style:normal;opacity:.25}
#map{position:absolute;right:16px;top:86px;width:110px;height:110px;opacity:.95}
#tools{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:8px}
#tools button{font:700 13px var(--body);color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
#big{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--display);font-size:clamp(64px,18vw,150px);line-height:1;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);pointer-events:none}
#toast{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:var(--display);font-size:clamp(26px,6vw,40px);color:var(--cream);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;pointer-events:none}
#touch{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
@media (pointer:coarse){#touch{display:flex}}
#touch div{display:flex;gap:12px}
#touch button{pointer-events:auto;touch-action:none;width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font:400 28px var(--display);box-shadow:4px 4px 0 var(--ink);opacity:.9;padding:0}
#touch button.on{background:var(--sun);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
#touch #tb{background:var(--berry);color:var(--cream);font-size:16px}
.overlay{position:absolute;inset:0;display:flex;padding:16px;overflow:auto}
.card{width:100%;max-width:470px;margin:auto;padding:20px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{margin:0;font-family:var(--display);font-weight:400;line-height:1;text-wrap:balance;color:var(--berry);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.card h1{font-size:clamp(34px,9vw,46px)}
.card h2{font-size:44px}
.card p{margin:0;font-size:14px;line-height:1.45}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;text-align:left;margin-bottom:-6px}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evs button{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font:900 14px var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.evs button[aria-pressed="true"]{background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
.evs small{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.evs em{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--grape)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{background:none;border:3px solid transparent;border-radius:14px;padding:6px 2px 5px;font:900 13px var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.pick i{width:38px;height:38px;border-radius:50%;border:5px solid;box-shadow:0 0 0 2px var(--ink)}
.go{font:400 26px var(--display);color:var(--ink);background:var(--mint);border:3px solid var(--ink);border-radius:14px;padding:10px 18px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.go.alt{background:var(--cream);font-size:19px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.laps{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums;font-size:15px;display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap}
.tot{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.rec{display:inline-block;background:var(--grape);color:var(--cream);border-radius:999px;padding:2px 12px;font-size:14px}
</style>

<div id="game">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="pos" class="sticker">1st<small>/4</small></div>
    <div id="tools">
      <button id="snd" type="button">Sound on</button>
      <button id="rst" type="button">Back on course</button>
    </div>
    <div id="lapbox" class="sticker"><b id="lap">Lap 1/3</b><span id="time">0:00.00</span></div>
    <div id="power" class="sticker" hidden></div>
    <canvas id="map" width="220" height="220"></canvas>
    <div id="toast"></div>
    <div id="big"></div>
    <div id="touch">
      <div><button id="tl" type="button" aria-label="Steer left">◀</button><button id="tr" type="button" aria-label="Steer right">▶</button></div>
      <div><button id="tu" type="button" aria-label="Climb">▲</button><button id="td" type="button" aria-label="Dive">▼</button><button id="tb" type="button">Brake</button></div>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="card sticker">
      <h1>Turbo Meadow Kart</h1>
      <div class="lab">Pick a race</div>
      <div class="evs" id="evs"></div>
      <div class="lab">Pick a racer</div>
      <div class="pick" id="pick"></div>
      <button class="go" id="start" type="button">Start race</button>
      <p id="how"></p>
    </div>
  </div>

  <div id="results" class="overlay" hidden>
    <div class="card sticker">
      <h2 id="place">1st place!</h2>
      <p id="rname"></p>
      <div><div class="tot" id="total">0:00.00</div><span class="rec" id="rec" hidden>New best time</span></div>
      <ul class="laps" id="laps"></ul>
      <p id="bestres"></p>
      <div class="row">
        <button class="go" id="again" type="button">Race again</button>
        <button class="go alt" id="change" type="button">Pick another race</button>
      </div>
    </div>
  </div>

  <div id="nogl" class="overlay" hidden><div class="card sticker"><h2>No 3D here</h2><p>This browser could not start WebGL, which the game needs. Try a current version of Chrome, Safari, Edge or Firefox.</p></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const N=640;
const RACERS=[
  {name:'Biscuit',kind:'bear',kart:0xff7a1a,head:0xb5733c},
  {name:'Pepper',kind:'cat',kart:0x7b5cff,head:0x9aa3b5},

   sky:['#2f9bff','#d6f3ff'],fog:[0xd6f3ff,260,950],

  {id:'lagoon',name:'Coconut Lagoon',veh:'ski',label:'Jet ski',laps:3,sc:1.6,W:17,pads:[0.1,0.36,0.62,0.85],ai:[50,1.5],curvK:0.42,jumps:[[0.24,0],[0.5,-5],[0.78,5]],

   jumps:[[0.12,0],[0.33,-6],[0.47,6],[0.7,0],[0.9,-5]],sky:['#ff7a45','#ffd59a'],fog:[0xffc08a,260,1000],
   pts:[[0,0,0],[90,0,-15],[160,0,-60],[150,0,-140],[90,0,-180],[30,0,-150],[-20,0,-200],[-100,0,-210],[-160,0,-160],[-140,0,-90],[-170,0,-30],[-120,0,30],[-50,0,30]]},
  /* Pilotwings style: bright sky, rolling green islands, big glowing rings; the plane follows the course unless you steer */
  {id:'sky',name:'Cloudtop Run',veh:'plane',label:'Plane',laps:2,sc:1.35,W:26,pads:[],ai:[57,1.5],curvK:0.3,
   sky:['#3f8ff0','#e6f5ff'],fog:[0xdcefff,420,1700],
   pts:[[0,60,0],[120,70,-20],[220,95,-90],[240,120,-190],[160,100,-260],[40,70,-240],[-40,45,-300],[-150,60,-280],[-230,90,-200],[-220,110,-90],[-140,80,-20],[-70,65,20]]}
];
const HOW={
  kart:['Arrow keys or WASD to drive. Space brakes. R puts you back on the road. Hills slow you on the way up and speed you up on the way down.','Gas is automatic. Use the buttons to steer and brake.'],
  ski:['Arrow keys or WASD to ride. Space brakes. The jet ski slides in turns, so start turning early. Hit the ramps, and hold left or right in the air to spin: land a full spin for a boost. On Sunset Bay, pass red buoys on your right and yellow on your left to build power.','Gas is automatic. Steer early: the jet ski slides. Hold a direction in the air to spin; land a full spin for a boost.'],
  plane:['The plane follows the course by itself: steer with left and right, climb and dive with up and down. Space is the air brake. Fly through the rings; gold ones give a boost.','Throttle and steering help are automatic. Nudge the arrows to line up the rings. Gold rings give a boost.']
};

let renderer;
try{
  if(!window.THREE) throw 0;
  renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,alpha:true});
}catch(e){ $('menu').hidden=true; $('nogl').hidden=false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd6f3ff,260,950);
const camera=new THREE.PerspectiveCamera(62,1,0.5,2600);
const hemi=new THREE.HemisphereLight(0xffffff,0x88b060,0.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2cc,0.75); sun.position.set(60,120,40); scene.add(sun);scene.add(sun.target);
const lowFx=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
if(!lowFx)GFX.sunShadow(renderer,sun,75,2048);
const fxP=GFX.particles(scene,lowFx?180:420,false),fxA=GFX.particles(scene,160,true);
GFX.vignette($('view'),0.38);
const sunGlow=GFX.glow(0xfff0c0,620,0.85);scene.add(sunGlow);const sunHalo=GFX.glow(0xffe0a0,1900,0.28);scene.add(sunHalo);
function fxShadows(){
  if(world&&!world.userData.sh){world.userData.sh=1;world.traverse(o=>{if(!o.isMesh)return;o.receiveShadow=true;const m=o.material;if(m&&m.transparent)return;if(!o.geometry.boundingSphere)o.geometry.computeBoundingSphere();const rr=o.geometry.boundingSphere.radius*Math.max(o.scale.x,o.scale.y,o.scale.z);if(rr<16&&rr>0.6)o.castShadow=true;});}
  karts.forEach(k=>{if(k.mesh&&!k.mesh.userData.sh){k.mesh.userData.sh=1;k.mesh.traverse(o=>{if(o.isMesh&&!(o.material&&o.material.transparent))o.castShadow=true;});}});
}
function fxKarts(dt){
  karts.forEach(k=>{
    const fx=Math.sin(k.h),fz=Math.cos(k.h),rx=fz,rz=-fx,R=Math.random;
    const sp=ev.veh==='ski'?Math.hypot(k.vx||0,k.vz||0):Math.abs(k.speed||0);
    const bx=k.x-fx*1.7,bz=k.z-fz*1.7;
    if(ev.veh==='kart'){
      if(sp>18&&(Math.abs(k.steer||0)>0.45||sp>55)&&R()<dt*(Math.abs(k.steer||0)>0.45?40:14)){const sd=R()<0.5?-1:1;fxP.emit(bx+rx*sd*0.95,k.y+0.25,bz+rz*sd*0.95,-fx*sp*0.08+(R()-0.5)*2,1.2+R()*1.5,-fz*sp*0.08+(R()-0.5)*2,0.55+R()*0.3,1.3,ev.dust||0xe6d6ae,-0.5,2.2,0.42);}
    }else if(ev.veh==='ski'){
      if(sp>10&&R()<dt*60){const sd=R()<0.5?-1:1;fxP.emit(bx+rx*sd*0.8,k.y+0.3,bz+rz*sd*0.8,rx*sd*(2+R()*3)-fx*2,3+R()*4,rz*sd*(2+R()*3)-fz*2,0.6+R()*0.3,0.9,0xffffff,14,1.6,0.7);}
    }else{
      if(sp>20&&R()<dt*45){const sd=R()<0.5?-1:1;fxP.emit(k.x+rx*sd*2.3-fx*0.6,k.y+0.6,k.z+rz*sd*2.3-fz*0.6,0,0,0,1.3,0.55,0xffffff,0,2.5,0.3);}
    }
    if(k.boost>0){for(let i=0;i<2;i++)fxA.emit(bx+(R()-0.5)*0.7,k.y+0.7+(R()-0.5)*0.3,bz+(R()-0.5)*0.7,-fx*(6+R()*8),R()*1.5,-fz*(6+R()*8),0.22+R()*0.14,1.5,R()<0.5?0xffa030:0x58c8ff,0,-0.6,0.9);}
  });
}

let seed=1;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const C=h=>new THREE.Color(h);
const lam=c=>new THREE.MeshLambertMaterial({color:c});
const std=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r===undefined?0.6:r});
const flat=()=>new THREE.MeshPhongMaterial({flatShading:true,shininess:0});
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return new THREE.CanvasTexture(c);}
const checker=canvasTex(16,4,g=>{for(let x=0;x<16;x++)for(let y=0;y<4;y++){g.fillStyle=(x+y)%2?'#1d1640':'#fff8e7';g.fillRect(x,y,1,1);}});checker.magFilter=THREE.NearestFilter;
const padTex=canvasTex(64,64,g=>{g.fillStyle='#ff8a1a';g.fillRect(0,0,64,64);g.strokeStyle='#fff3a6';g.lineWidth=8;for(let y=0;y<3;y++){g.beginPath();g.moveTo(10,24+y*20);g.lineTo(32,6+y*20);g.lineTo(54,24+y*20);g.stroke();}});
const padMat=new THREE.MeshBasicMaterial({map:padTex,side:THREE.DoubleSide});

/* ---------- world (rebuilt for each race) ---------- */
let world=null,ev=EVENTS[0],S=[],T=[],NR=[],CURV=[],HL=[],segLen=1,W=11,PADS=[],RINGS=[],balloons=[],waterTex=null,ringNext=0;
const wave=(x,z,t)=>Math.sin(x*0.08+t*1.6)*0.45+Math.sin(z*0.11+t*1.2)*0.35;
/* the water height a jet ski rides on: small chop, or long Wave Race swells on Sunset Bay */
const sea=(x,z,t)=>ev&&ev.swell?Math.sin(x*0.03+t*0.9)*1.5+Math.sin(z*0.024+x*0.008+t*0.7)*1.2+wave(x,z,t)*0.25:wave(x,z,t)*0.4;
function nearest(x,z){let b=1e18,bi=0;for(let i=0;i<N;i+=2){const dx=x-S[i].x,dz=z-S[i].z,q=dx*dx+dz*dz;if(q<b){b=q;bi=i;}}return [bi,Math.sqrt(b)];}
function hill(x,z){return ev.id==='pine'?26+70*Math.abs(Math.sin(x*0.0061+1)*Math.cos(z*0.0068)):3+7*Math.sin(x*0.013)*Math.cos(z*0.011);}
function groundH(x,z){const r=nearest(x,z),base=S[r[0]].y-0.9;if(r[1]<40)return base;const k=Math.min(1,(r[1]-40)/110),s=k*k*(3-2*k);return base*(1-s)+hill(x,z)*s;}
function ribbon(a,b,dyA,colorFn,dyB){
  if(dyB===undefined)dyB=dyA;

  for(let i=0;i<N;i++){
    const c=colorFn(i); if(!c) continue; const j=(i+1)%N;
    const P=[[S[i],NR[i],a,dyA],[S[i],NR[i],b,dyB],[S[j],NR[j],a,dyA],[S[j],NR[j],b,dyB]].map(q=>[q[0].x+q[1].x*q[2],q[0].y+q[3],q[0].z+q[1].z*q[2]]);
    [0,1,2,1,3,2].forEach(k=>{pos.push(P[k][0],P[k][1],P[k][2]);col.push(c.r,c.g,c.b);});

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));

}
function quadAt(i,half,len,mat,dy){
  const a=(i-len+N)%N,b=(i+len)%N,p=[[a,-half,0,0],[a,half,1,0],[b,-half,0,1],[b,half,1,1]].map(q=>[S[q[0]].x+NR[q[0]].x*q[1],S[q[0]].y+dy,S[q[0]].z+NR[q[0]].z*q[1],q[2],q[3]]);
  const pos=[],uv=[];[0,1,2,1,3,2].forEach(k=>{pos.push(p[k][0],p[k][1],p[k][2]);uv.push(p[k][3],p[k][4]);});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  const m=new THREE.Mesh(g,mat);world.add(m);return m;
}
function arch(){
  const h0=Math.atan2(T[0].x,T[0].z),grp=new THREE.Group();grp.position.copy(S[0]);grp.rotation.y=h0;world.add(grp);
  const pm=lam(0xff4d6d),dip=ev.veh==='ski'?2:0;
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,14+dip,10),pm);p.position.set(s*(W+3),7-dip/2,0);grp.add(p);
    const b=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,10),lam(0xffc928));b.position.set(s*(W+3),14.6,0);grp.add(b);
    if(ev.veh==='ski'){const f=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,1,12),lam(0xfff8e7));f.position.set(s*(W+3),0.2,0);grp.add(f);}});
  const beam=new THREE.Mesh(new THREE.BoxGeometry(W*2+6,3.2,1),new THREE.MeshBasicMaterial({map:checker}));beam.position.y=12.4;grp.add(beam);
}
function instTrees(list,palette){
  if(!list.length)return;

  drops.forEach(d=>{if(d.t<=0)return;d.t-=dt;d.vy-=18*dt;d.m.position.x+=d.vx*dt;d.m.position.y+=d.vy*dt;d.m.position.z+=d.vz*dt;if(d.t<=0||d.m.position.y<0)d.m.visible=false,d.t=0;});

  fxShadows();if(state==='race'||state==='done')fxKarts(dt);
  const p=player,base=camera.aspect<1?82:62,plane=ev.veh==='plane';
  if(state==='menu'){
    const c=S[N-16],r=plane?55:44;camera.position.set(c.x+Math.cos(time*0.25)*r,c.y+22,c.z+Math.sin(time*0.25)*r);camera.lookAt(c.x,c.y+2,c.z);camera.fov=base;
  }else{
    const fx=Math.sin(p.h),fz=Math.cos(p.h),D=plane?15:12.5;
    camPitch+=(p.pv-camPitch)*Math.min(1,dt*4);
    camT.set(p.x-fx*D,p.y+(plane?4.6:6.2)-Math.sin(camPitch)*D*0.7,p.z-fz*D);
    if(camSnap){camera.position.copy(camT);camSnap=false;camPitch=0;}else camera.position.lerp(camT,1-Math.exp(-5.5*dt));
    camera.lookAt(p.x+fx*8,p.y+2.2+Math.sin(camPitch)*8,p.z+fz*8);
    camera.fov+=((base+(p.boost>0&&!p.ai?12:0))-camera.fov)*Math.min(1,dt*5);
  }
  camera.updateProjectionMatrix();

  if(state!=='menu'){
    const rank=karts.filter(k=>total(k)>total(p)).length;
    $('pos').firstChild.nodeValue=ORD[rank];
    $('lap').textContent='Lap '+Math.max(1,Math.min(ev.laps,p.lap))+'/'+ev.laps;
    $('time').textContent=fmt(raceT);
    drawMap();
  }
  if(bigT>0){bigT-=dt;if(bigT<=0)$('big').textContent='';}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').textContent='';}
  if(ac&&eng){eng.frequency.value=(plane?90:55)+Math.abs(ev.veh==='ski'?Math.hypot(p.vx,p.vz):p.speed)*2.3;engGain.gain.value=(state==='race')?(SFX.has('engine')?0:0.03):0;}
  {const sp=Math.abs(ev.veh==='ski'?Math.hypot(p.vx,p.vz):p.speed),run=state==='race';
   if(!sfxEng&&SFX.ready){sfxEng=SFX.loop('engine',{game:true,vol:0});sfxSkid=SFX.loop('skid',{game:true,vol:0});}
   if(sfxEng){sfxEng.vol(run?0.3+Math.min(0.25,sp/300):0);sfxEng.rate((plane?0.9:ev.veh==='ski'?0.75:0.6)+sp/(plane?90:60));
    sfxSkid.vol(run&&ev.veh==='kart'&&sp>24&&Math.abs(p.steer)>0.6?Math.min(0.6,(sp-24)/40):0);}}
  {const q=state==='menu'?S[N-16]:p,low=ev.id==='sunset';sun.target.position.set(q.x,q.y,q.z);sun.position.set(q.x+(low?-110:60),q.y+(low?38:120),q.z+(low?-80:40));
   if(low)sunGlow.position.set(camera.position.x-1100,camera.position.y+130,camera.position.z-800);else sunGlow.position.set(camera.position.x+600,camera.position.y+1200,camera.position.z+400);sunHalo.position.copy(sunGlow.position);
   fxP.tick(dt,camera,renderer.domElement.height);fxA.tick(dt,camera,renderer.domElement.height);}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function startRace(){
  initAudio();resetRace();
  $('menu').hidden=true;$('results').hidden=true;$('hud').hidden=false;
  const plane=ev.veh==='plane';$('tu').hidden=!plane;$('td').hidden=!plane;$('tb').hidden=plane;
  $('toast').textContent='';state='count';cd=3;cdShown=0;powerHud();
}
function evButtons(){
  [].forEach.call($('evs').children,(b,i)=>{const e=EVENTS[i],r=best.ev[e.id];b.setAttribute('aria-pressed',e===ev);
    b.innerHTML='<em>'+e.label+'</em>'+e.name+'<small>'+(r&&r.total?'Best '+fmt(r.total)+' · '+ORD[r.place-1]:'Not raced yet')+'</small>';});
  $('how').textContent=HOW[ev.veh][autoGas?1:0];
}
function showMenu(){state='menu';$('results').hidden=true;$('hud').hidden=true;$('menu').hidden=false;resetRace();evButtons();}
EVENTS.forEach((e,i)=>{
  const b=document.createElement('button');b.type='button';b.id='ev'+i;
  b.addEventListener('click',()=>{if(e!==ev){buildWorld(e);buildKarts();}try{localStorage.setItem('tmk-event',e.id);}catch(x){}evButtons();});
  $('evs').appendChild(b);
});
RACERS.forEach((r,i)=>{
  const b=document.createElement('button');b.type='button';b.id='pick'+i;b.setAttribute('aria-pressed',i===choice);
  b.innerHTML='<i style="background:'+hex(r.head)+';border-color:'+hex(r.kart)+'"></i>'+r.name;
  b.addEventListener('click',()=>{choice=i;[].forEach.call($('pick').children,(c,n)=>c.setAttribute('aria-pressed',n===i));
    try{localStorage.setItem('tmk-racer',String(i));}catch(e){}buildKarts();});
  $('pick').appendChild(b);
});
try{const c=parseInt(localStorage.getItem('tmk-racer'),10);if(c>=0&&c<RACERS.length){choice=c;[].forEach.call($('pick').children,(el,n)=>el.setAttribute('aria-pressed',n===c));}}catch(e){}
let ev0=EVENTS[0];try{const id=localStorage.getItem('tmk-event');ev0=EVENTS.find(e=>e.id===id)||ev0;}catch(e){}
$('start').addEventListener('click',startRace);
$('again').addEventListener('click',startRace);
$('change').addEventListener('click',showMenu);
$('rst').addEventListener('click',backOnTrack);
$('snd').addEventListener('click',()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'Sound on':'Sound off';if(master)master.gain.value=soundOn?1:0;SFX.gameMute(!soundOn);});
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{
  if(KEYS[e.code]){input[KEYS[e.code]]=true;e.preventDefault();}
  else if(e.code==='KeyR')backOnTrack();
  else if(e.code==='Enter'&&!e.repeat){if(!$('menu').hidden||!$('results').hidden){e.preventDefault();startRace();}}
});
window.addEventListener('keyup',e=>{if(KEYS[e.code])input[KEYS[e.code]]=false;});
window.addEventListener('blur',()=>{input.up=input.down=input.left=input.right=input.brake=false;});
[['tl','left'],['tr','right'],['tb','brake'],['tu','up'],['td','down']].forEach(([id,key])=>{
  const el=$(id),off=()=>{input[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;el.classList.add('on');});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});

buildWorld(ev0);buildKarts();showMenu();
requestAnimationFrame(frame);
})();
</script>
